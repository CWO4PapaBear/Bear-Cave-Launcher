name: Build launcher downloads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.22.3
      - run: python tools/build_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: BearCaveLauncher-${{ matrix.os }}
          path: dist/BearCaveLauncher-*.zip
          if-no-files-found: error
