name: Area 52 package patch notes
run-name: Edit existing Area52 bot patch notes
on:
  workflow_dispatch:
    inputs:
      package_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: area52-daily-patch-notes
  cancel-in-progress: false
jobs:
  edit:
    if: inputs.package_id == 'area52-playerbots-startup-recovery-20261029'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Edit and read back existing message
        env:
          DISCORD_PATCH_NOTES_WEBHOOK: ${{ secrets.DISCORD_PATCH_NOTES_WEBHOOK }}
        run: python tools/area52_publication/edit_bot_notes_20261029.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discord-edit-receipt
          path: |
            discord-before.json
            discord-after.json
            edit-receipt.json
