name: Area 52 hoplite patch notes
on:
  workflow_dispatch:
    inputs:
      edit_message:
        description: Existing webhook message ID to update instead of posting again
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ptr-discord-patch-notes
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Announce verified Area 52 hoplite
        env:
          DISCORD_PATCH_NOTES_WEBHOOK: ${{ secrets.DISCORD_PATCH_NOTES_WEBHOOK }}
          DISCORD_EDIT_MESSAGE_ID: ${{ inputs.edit_message }}
        run: python tools/announce_area52_hoplite.py
