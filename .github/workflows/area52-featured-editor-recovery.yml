name: Area 52 Featured editor announcement recovery
run-name: Area52 Featured editor pre-send recovery
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: area52-daily-patch-notes
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Recover proven pre-send failure once
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_PATCH_NOTES_WEBHOOK: ${{ secrets.DISCORD_PATCH_NOTES_WEBHOOK }}
        run: python tools/area52_publication/recover_featured_editor_20261125.py
      - name: Retain delivery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: featured-editor-recovery-receipt
          path: |
            discord-receipt.json
            recovery-journals/
          if-no-files-found: ignore
