name: Area 52 Legendary dependency patch notes
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ptr-discord-patch-notes
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Announce verified Area 52 package
        env:
          DISCORD_PATCH_NOTES_WEBHOOK: ${{ secrets.DISCORD_PATCH_NOTES_WEBHOOK }}
        run: python tools/announce_area52_legendary_dependencies.py
