name: PTR Discord patch notes
on:
  push:
    branches: [main]
    paths: [channels/ptr.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ptr-discord-patch-notes
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Announce published PTR update
        env:
          DISCORD_PATCH_NOTES_WEBHOOK: ${{ secrets.DISCORD_PATCH_NOTES_WEBHOOK }}
        run: python tools/announce_ptr.py
