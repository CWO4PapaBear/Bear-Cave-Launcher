name: Area 52 Mage talent patch notes
on:
  workflow_dispatch:
    inputs:
      verify_message_id:
        description: 'Read-only verification of an existing message; leave blank to publish'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ptr-discord-patch-notes
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Announce verified Mage talent package
        env:
          DISCORD_PATCH_NOTES_WEBHOOK: ${{ secrets.DISCORD_PATCH_NOTES_WEBHOOK }}
          VERIFY_MESSAGE_ID: ${{ inputs.verify_message_id }}
        run: |
          if [ -n "$VERIFY_MESSAGE_ID" ]; then
            python tools/announce_area52_mage_talents.py --verify-message "$VERIFY_MESSAGE_ID"
          else
            python tools/announce_area52_mage_talents.py
          fi
      - name: Preserve Discord receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: area52-mage-talents-discord-receipt
          path: discord-mage-talents-receipt.json
          if-no-files-found: ignore

